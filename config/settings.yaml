entity_matching:
  # Threshold do fuzzy matching (rapidfuzz, escala 0-1). Match abaixo disso
  # é descartado -- não gera resultado nem é registrado como "match fraco".
  # Ver src/entity_matcher.py e classifier-prisma/context.md, seção 3.1.
  fuzzy_threshold: 0.85

entity_scope:
  # Decisão de fase (equipe, 2026-08-28) -- ver
  # data/annotation/pendencias-tecnicas.md, seção "Mudança de escopo do
  # projeto (2026-08-28)". NÃO é limitação técnica: a v1 do classifier só
  # processa candidatos a presidente/vice-presidente (e os partidos deles),
  # não o universo inteiro de `entidade_matching`. Quando a v2 ampliar o
  # escopo (hipótese registrada: governador+vice+senador), atualizar esta
  # lista com os valores de `tabela_candidatura.ds_cargo`/
  # `entidade_matching.ds_cargo` correspondentes -- ver
  # `entities_store.load_active_entities_from_db`.
  cargos:
    - "PRESIDENTE"
    - "VICE-PRESIDENTE"

model:
  # Identificação do modelo/versão gravada em cada classification_run --
  # ver README sobre esta ser uma baseline léxico/regra (v1), não um modelo
  # de ML treinado.
  name: "lexicon-baseline"
  version: "1"

logging:
  log_path: "logs/classifier.log"
