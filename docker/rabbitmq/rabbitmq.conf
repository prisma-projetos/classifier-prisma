# ATENCAO: configuracao SO PARA DESENVOLVIMENTO LOCAL (docker-compose deste
# repositorio). NAO reflete a configuracao real de producao do RabbitMQ,
# que e gerenciada pelo time de DevOps fora deste repositorio.
# Ver docker/rabbitmq/README.md para o motivo de cada linha abaixo.

# Carrega filas/exchange/bind de definitions.json no boot do broker -- forma
# declarativa de provisionar a topologia que o Classifier precisa para
# consumir/publicar localmente (ver docker/rabbitmq/definitions.json).
load_definitions = /etc/rabbitmq/definitions.json

# Permite login do usuario "guest" fora de localhost. Necessario porque,
# com Docker, a conexao do host para o container passa pelo NAT do Docker e
# nao e vista pelo RabbitMQ como loopback -- sem isso, o guest e bloqueado
# por padrao (guest_loopback_only). Aceitavel so em desenvolvimento local;
# NUNCA fazer isso em producao.
loopback_users = none
